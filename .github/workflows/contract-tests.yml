name: Contract Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/services/**'
      - 'frontend/src/lib/api/**'
      - 'backend/src/api/**'
      - 'frontend/tests/contracts/**'
      - 'backend/tests/contracts/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  consumer-tests:
    name: Consumer Contract Tests (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Consumer Contract Tests
        working-directory: frontend
        run: |
          npx vitest run tests/contracts/ --reporter=verbose
        continue-on-error: true

      - name: Upload Pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: frontend/pacts/
          retention-days: 7

      - name: Create consumer summary
        if: always()
        run: |
          echo "## Consumer Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d frontend/pacts ]; then
            echo "### Generated Contracts:" >> $GITHUB_STEP_SUMMARY
            ls -la frontend/pacts/ >> $GITHUB_STEP_SUMMARY
          else
            echo "No contracts generated" >> $GITHUB_STEP_SUMMARY
          fi

  provider-verification:
    name: Provider Verification (Backend)
    runs-on: ubuntu-latest
    needs: consumer-tests
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invest_user
          POSTGRES_PASSWORD: invest_pass_2024
          POSTGRES_DB: invest_platform_db
        ports:
          - 5532:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Download Pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: backend/pacts/

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
        run: npm run migration:run

      - name: Seed test data
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
        run: npm run seed || true

      - name: Start backend server
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
          REDIS_HOST: localhost
          REDIS_PORT: 6479
          PORT: 3101
        run: |
          npm start &
          sleep 15
          curl -f http://localhost:3101/health || exit 1

      - name: Run Provider Verification
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
        run: |
          npx jest tests/contracts/ --verbose || true

      - name: Create provider summary
        if: always()
        run: |
          echo "## Provider Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Provider verification completed against consumer contracts." >> $GITHUB_STEP_SUMMARY

  contract-summary:
    name: Contract Test Summary
    runs-on: ubuntu-latest
    needs: [consumer-tests, provider-verification]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Contract Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Consumer (Frontend) | ${{ needs.consumer-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Provider (Backend) | ${{ needs.provider-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.consumer-tests.result }}" == "success" ] && [ "${{ needs.provider-verification.result }}" == "success" ]; then
            echo "### Contract Verified" >> $GITHUB_STEP_SUMMARY
            echo "Frontend and Backend contracts are in sync." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Contract Mismatch" >> $GITHUB_STEP_SUMMARY
            echo "Review the contract tests for discrepancies." >> $GITHUB_STEP_SUMMARY
          fi

  can-i-deploy:
    name: Can I Deploy?
    runs-on: ubuntu-latest
    needs: [contract-summary]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check deployment readiness
        run: |
          echo "## Deployment Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.contract-summary.result }}" == "success" ]; then
            echo "### Ready to Deploy" >> $GITHUB_STEP_SUMMARY
            echo "All contract tests passed. Safe to deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "### NOT Ready to Deploy" >> $GITHUB_STEP_SUMMARY
            echo "Contract tests failed. Do not deploy until fixed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
