name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress

jobs:
  k6-smoke-test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invest_user
          POSTGRES_PASSWORD: invest_pass_2024
          POSTGRES_DB: invest_platform_db
        ports:
          - 5532:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
        run: npm run migration:run

      - name: Start backend server
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
          REDIS_HOST: localhost
          REDIS_PORT: 6479
          PORT: 3101
        run: |
          npm start &
          sleep 10
          curl -f http://localhost:3101/health || exit 1

      - name: Setup k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/smoke-test.js
          flags: --out json=k6-results.json

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: k6-results.json
          retention-days: 7

      - name: Create k6 summary report
        if: always()
        run: |
          if [ -f reports/performance/smoke-test-summary.json ]; then
            echo "### k6 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/performance/smoke-test-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  k6-load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'load'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invest_user
          POSTGRES_PASSWORD: invest_pass_2024
          POSTGRES_DB: invest_platform_db
        ports:
          - 5532:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
        run: npm run migration:run

      - name: Start backend server
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5532
          DB_USER: invest_user
          DB_PASSWORD: invest_pass_2024
          DB_NAME: invest_platform_db
          REDIS_HOST: localhost
          REDIS_PORT: 6479
          PORT: 3101
        run: |
          npm start &
          sleep 10
          curl -f http://localhost:3101/health || exit 1

      - name: Setup k6 for load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
          flags: --out json=k6-load-results.json -e SCENARIO=load

      - name: Upload k6 load results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-results
          path: k6-load-results.json
          retention-days: 14

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [k6-smoke-test]
    if: always()

    steps:
      - name: Check performance results
        run: |
          echo "## Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| k6 Smoke Test | ${{ needs.k6-smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
